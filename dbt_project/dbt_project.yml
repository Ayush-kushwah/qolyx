name: 'qolyx'
version: '1.0.0'
config-version: 2

# Require a specific dbt version
require-dbt-version: [">=1.7.0", "<2.0.0"]

profile: 'qolyx'

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

# Configuring models
models:
  qolyx:
    bronze:
      materialized: table
      schema: bronze
      tags: ['bronze']
    silver:
      materialized: table
      schema: silver
      tags: ['silver']
    gold:
      materialized: table
      schema: gold
      tags: ['gold']

# Configuring tests
tests:
  qolyx:
    +store_failures: true
    +schema: test_results
    +severity: error

# Project-level variables
vars:
  trust_score_enabled: true
  penalty_per_failed_test: 7
  max_dbt_penalty: 20
