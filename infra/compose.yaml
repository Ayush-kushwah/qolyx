services:
  qolyx-db:
    image: postgres:15-alpine
    container_name: qolyx-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - qolyx-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  qolyx-cache:
    image: redis:7-alpine
    container_name: qolyx-cache
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - qolyx-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  qolyx-backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: qolyx-backend
    command: >
      sh -c "alembic upgrade head && uvicorn backend.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "${BACKEND_PORT}:8000"
    volumes:
      - ../backend:/app/backend
      - ../demo:/app/demo
    environment:
      - ENVIRONMENT=${ENVIRONMENT}
      - DEBUG=${DEBUG}
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - BACKEND_PORT=${BACKEND_PORT}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - REDIS_PORT=${REDIS_PORT}
      - ALERT_EMAIL_SENDER=${ALERT_EMAIL_SENDER}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY}
      - ANOMALY_DECAY_FACTOR=${ANOMALY_DECAY_FACTOR}
    depends_on:
      qolyx-db:
        condition: service_healthy
      qolyx-cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  qolyx-airflow:
    image: apache/airflow:2.9.0
    container_name: qolyx-airflow
    restart: always
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@qolyx-db:5432/postgres
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW_FERNET_KEY}
      - AIRFLOW__WEBSERVER__SECRET_KEY=${AIRFLOW_SECRET_KEY}
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__LOGGING__LOGGING_LEVEL=INFO
      - PYTHONPATH=/opt/airflow
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - ENVIRONMENT=${ENVIRONMENT}
      - ANOMALY_DECAY_FACTOR=${ANOMALY_DECAY_FACTOR}
    volumes:
      - ../airflow_dags:/opt/airflow/dags
      - ../backend:/opt/airflow/backend
      - airflow-logs:/opt/airflow/logs
    ports:
      - "${AIRFLOW_PORT}:8080"
    depends_on:
      qolyx-db:
        condition: service_healthy
      qolyx-cache:
        condition: service_healthy
    command: >
      bash -c "pip install httpx sqlalchemy psycopg2-binary redis &&
               airflow db migrate &&
               (airflow users create --username admin --password admin --firstname Qolyx --lastname Admin --role Admin --email admin@qolyx.ai || true) &&
               airflow webserver & airflow scheduler"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  qolyx-dbt:
    image: ghcr.io/dbt-labs/dbt-postgres:1.7.0
    container_name: qolyx-dbt
    restart: "no"
    entrypoint: []
    environment:
      - DBT_HOST=qolyx-db
      - DBT_USER=${POSTGRES_USER}
      - DBT_PASSWORD=${POSTGRES_PASSWORD}
      - DBT_PORT=5432
      - DBT_DBNAME=${POSTGRES_DB}
      - DBT_PROFILES_DIR=/usr/app/dbt_project
    volumes:
      - ../dbt_project:/usr/app/dbt_project
    working_dir: /usr/app/dbt_project
    depends_on:
      qolyx-db:
        condition: service_healthy
    command: >
      sh -c "dbt deps &&
             dbt seed --full-refresh &&
             dbt run --models bronze+ &&
             dbt test --store-failures"

volumes:
  qolyx-db-data:
    driver: local
  qolyx-redis-data:
    driver: local
  airflow-logs:
    driver: local
